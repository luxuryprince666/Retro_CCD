name: Build RetroCCD APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Install Gradle 8.14.4
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.4'
          validate-wrappers: false

      # Kotlin Gradle Plugin 2.4.21 treats the old kotlinOptions.jvmTarget DSL as an error.
      # Patch only the CI working copy so no Gradle/Kotlin knowledge is needed from the user.
      - name: Migrate Kotlin JVM target DSL
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle.kts")
          source = path.read_text(encoding="utf-8")
          old_block = '    kotlinOptions {\n        jvmTarget = "17"\n    }\n'
          if old_block not in source:
              if "compilerOptions" in source:
                  print("Kotlin compilerOptions DSL is already configured; no patch needed.")
                  raise SystemExit(0)
              raise SystemExit("Could not find the expected kotlinOptions.jvmTarget block in app/build.gradle.kts")

          source = source.replace(old_block, "", 1)
          anchor = "}\n\ndependencies {"
          replacement = (
              "}\n\n"
              "kotlin {\n"
              "    compilerOptions {\n"
              "        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)\n"
              "    }\n"
              "}\n\n"
              "dependencies {"
          )
          if anchor not in source:
              raise SystemExit("Could not find the android/dependencies boundary in app/build.gradle.kts")
          source = source.replace(anchor, replacement, 1)
          path.write_text(source, encoding="utf-8")
          print("Migrated kotlinOptions.jvmTarget to compilerOptions.jvmTarget.")
          PY

      # AndroidX Core 1.19.1 requires compileSdk 37 and AGP 9.1.
      # This project intentionally targets compileSdk 36 with AGP 8.13.2.
      - name: Pin AndroidX Core to API 36-compatible version
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle.kts")
          source = path.read_text(encoding="utf-8")
          old = 'implementation("androidx.core:core-ktx:1.19.1")'
          new = 'implementation("androidx.core:core-ktx:1.17.0")'
          if old in source:
              source = source.replace(old, new, 1)
              path.write_text(source, encoding="utf-8")
              print("Pinned AndroidX Core KTX to 1.17.0 for compileSdk 36.")
          elif new in source:
              print("AndroidX Core KTX 1.17.0 is already pinned.")
          else:
              raise SystemExit("Could not find the expected androidx.core:core-ktx dependency.")
          PY

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: RetroCCD-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
